<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="js/app.js"></script>
</head>
<body>

<header>
    <h1>Lo quieres, te lo vendo</h1> 
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<section class="container my-4">
    <!-- El formulario ahora envuelve a todos sus elementos internos -->
    <form id="formContacto" action="#" method="post" class="bg-dark text-white p-4 rounded shadow-sm mx-auto" style="max-width: 600px;">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" required id="nombre" name="nombre" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" required id="email" name="email" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label for="Asunto" class="form-label">Asunto</label>
            <select class="form-select" id="Asunto" name="asunto">
                <option value="cotizacion">Cotización</option>
                <option value="pedido">Pedido</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" required id="mensaje" name="mensaje" rows="5"></textarea>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="" required id="check">
            <label class="form-check-label" for="check">
                Acepto los términos y condiciones
            </label>
        </div>
        <button id="btnEnviar" type="submit" class="btn btn-primary btn-lg w-100">Enviar Mensaje</button>
    </form>
</section>

</body>
</html>
