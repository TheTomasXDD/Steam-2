<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="register-shell">
        <div class="register-card">
            <div class="register-header">
                <span class="brand-badge">YT2</span>
                <h1>Registro de usuario</h1>
                <p>Crea tu cuenta para acceder al panel</p>
            </div>

            <form id="register-form" novalidate>
                <div class="input-group">
                    <label for="fullName">Nombre completo</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Tu nombre completo" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="usuario123" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirmar</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                </div>

                <label class="checkbox-line">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>Acepto los términos y condiciones</span>
                </label>

                <div id="form-message" class="form-message" aria-live="polite"></div>

                <div class="button-row">
                    <button type="submit" class="primary-btn">Registrarme</button>
                    <button type="reset" class="secondary-btn">Limpiar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="tactil.js"></script>
</body>
</html>
